  const mob=isMob();
  const rows=all.map(x=>mob
    ?`<div class="mcard"><div class="mc-h"><div><b>${esc(x.ket)}</b><div class="mc-sub">${esc(x.t)} · ${esc(x.cat)}</div></div>${wStBadge(x.st)}</div></div>`
    :`<tr><td>${esc(x.t)}</td><td><b>${esc(x.ket)}</b><div class="mu">${esc(x.cat)}</div></td><td>${wStBadge(x.st)}</td></tr>`).join('');
  return head+
  `<div class="card"><div class="bt" style="flex-wrap:wrap"><h3>Bulan</h3><select class="in" style="width:auto" aria-label="Bulan absensi" onchange="S.wb=this.value;render(true)">${bulans.map(b=>`<option value="${esc(b)}" ${b===S.wb?'selected':''}>${esc(wBulanLb(b))}</option>`).join('')}</select></div>`+
    `<div class="stats mt">${stats.map(([l,v,k])=>`<div class="stat ${k}"><b>${v}</b><span>${esc(l)}</span></div>`).join('')}</div></div>`+
  `<div class="card mt"><h3>Rincian absensi — ${esc(wBulanLb(S.wb))}</h3>`+
    (mob?`<div class="mcl" style="margin-top:12px">${rows||'<div class="mcard"><span class="mu">Tidak ada catatan pada bulan ini.</span></div>'}</div>`
      :`<div class="tw" style="margin-top:12px"><table><thead><tr><th>Tanggal</th><th>Kegiatan</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="mu">Tidak ada catatan pada bulan ini.</td></tr>'}</tbody></table></div>`)+
    (all.length>=120?'<p class="mu mt">Menampilkan 120 catatan terbaru saja.</p>':'')+
    `</div>`;
}
function wLvg(){
  const d=WD||{sw:{},ksl:[]};
  const list=d.ksl||[];
  const poin=list.reduce((a,x)=>a+(+x.p||0),0);
  const stB=s=>{const v=String(s||'BARU');return `<span class="badge b-${v==='SELESAI'?'ok':v==='DIPROSES'?'wa':'er'}">${esc(v)}</span>`;};
  return`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>Pelanggaran ${esc(d.sw.n||'')}</h2><p class="mu">Total poin akumulasi: <b>${poin}</b>${poin>=50?' — melewati ambang surat perjanjian BK (50 poin).':''}</p></div></div>`+
  (list.length?`<div class="mcl">${list.map(x=>`<div class="mcard"><div class="mc-h"><div><b>${esc(x.jn||'-')}</b><div class="mc-sub">${esc(x.t||'-')} · Pelapor: ${esc(x.pln||'-')} · <b>${esc(x.p||0)} poin</b></div></div>${stB(x.st)}</div>`+
    (x.ur?`<div class="mbody mt">${esc(x.ur)}</div>`:'')+
    (x.td?`<div class="mu mt"><b>Tindakan:</b> ${esc(x.td)}</div>`:'')+
    (x.hs?`<div class="mu mt"><b>Hasil:</b> ${esc(x.hs)}</div>`:'')+`</div>`).join('')}</div>`
    :`<div class="card"><p class="mu">Alhamdulillah, belum ada catatan pelanggaran untuk anak Anda.</p></div>`);
}
function wThf(){
  const d=WD||{sw:{},thf:[]};
  const list=d.thf||[];
  return`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>Tahfidz ${esc(d.sw.n||'')}</h2><p class="mu">Materi hafalan kelas ${esc(d.sw.k||'-')} dan batas hafalan terakhir anak Anda.</p></div></div>`+
  (list.length?`<div class="mcl">${list.map(x=>`<div class="mcard"><div class="mc-h"><div><b>${esc(x.n)}</b><div class="mc-sub">${x.pg?'Pengampu: '+esc(x.pg):'Pengampu belum diatur'}${x.ket?' · '+esc(x.ket):''}</div></div></div>`+
    (x.b?`<div class="mbody mt"><b>Batas hafalan:</b> ${esc(x.b)}</div><div class="mu mt">Setoran terakhir: ${esc(x.tg||'-')}</div>${x.ct?`<div class="mu mt"><b>Catatan:</b> ${esc(x.ct)}</div>`:''}`
      :`<div class="mu mt">Belum ada setoran yang dicatat.</div>`)+`</div>`).join('')}</div>`
    :`<div class="card"><p class="mu">Belum ada materi tahfidz untuk kelas ini.</p></div>`);
}
function wPrs(){
  const d=WD||{sw:{},kpr:[]};
  const list=d.kpr||[];
  return`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>Prestasi ${esc(d.sw.n||'')}</h2><p class="mu">Prestasi dan capaian anak Anda di madrasah.</p></div></div>`+
  (list.length?`<div class="mcl">${list.map(x=>`<div class="mcard"><div class="mc-h"><div><b>${esc(x.jd||'-')}</b><div class="mc-sub">${esc(x.t||'-')} · ${esc(x.jr||'-')} · ${esc(x.tg||'-')}</div></div><span class="tag">${esc(x.pj||'-')}</span></div>`+
    (x.ke?`<div class="mu mt">${esc(x.ke)}</div>`:'')+`</div>`).join('')}</div>`
    :`<div class="card"><p class="mu">Belum ada prestasi yang dicatat untuk anak Anda.</p></div>`);
}
function render(keep){
  const a=$('app');
  if(!a)return;
  if(!TBAR)TBAR=document.getElementById('tbar');
  if(TBAR&&TBAR.parentNode!==document.body)document.body.appendChild(TBAR);
  if(!S.user)a.innerHTML=vLogin();
  else{
    a.innerHTML=navTabs()+(S.user.r==='GURU'
      ?(S.view==='form'?(T.find(x=>x.id===S.tugasId)?vForm():vGuru())
        :S.view==='usulan'?vUsulan()
        :S.view==='absen'?vAbsenGuru()
        :S.view==='izin'?vIzin()
        :S.view==='keslanggar'?vKesLanggarGuru()
        :S.view==='kesprest'?vKesPrest()
        :S.view==='saradu'?vSarAduanGuru()
        :S.view==='sarpinjam'?vSarPinjamGuru()
        :S.view==='absmapel'?vAbsMapel()
        :S.view==='abseskul'?vAbsEkskul()
        :S.view==='nilai'?vNilai()
        :S.view==='perangkat'?vPerangkat()
        :S.view==='soal'?vSoal()
        :S.view==='dbd'?vDbd()
        :S.view==='inbox'?vInbox()
        :vGuru())
      :S.user.r==='WALIMURID'?vWali()
      :vAdmin());
    heroIns();
    if(S.user.r!=='GURU'&&S.user.r!=='WALIMURID'&&S.tab==='dbd'&&(S.dt||'lap')==='lap')rows();
  }
  renderSb();
  if(keep!==true)window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();closeSb();mbnMore(false);}});
document.addEventListener('click',e=>{const m=$('modal');if(m&&e.target===m)closeM();});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('role')==='button'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click();}
});
try{
  const mmq=matchMedia(MOBMQ),mh=()=>{if(S.user&&S.view!=='form'&&!nlChanged().length)render(true);};
  if(mmq.addEventListener)mmq.addEventListener('change',mh);else if(mmq.addListener)mmq.addListener(mh);
}catch(_){}
function bootErr(m){
  const a=$('app');
  if(a&&a.querySelector('.splash'))a.innerHTML=`<div class="card" style="margin-top:40px"><h3>Gagal memuat aplikasi</h3><p class="mu mt">${esc(m||'Terjadi kesalahan')}</p><div class="row mt"><button class="btn pri" onclick="location.reload()">Muat ulang</button><button class="btn ghost" onclick="try{localStorage.clear();sessionStorage.clear()}catch(_){};location.reload()">Reset sesi &amp; muat ulang</button></div></div>`;
}
window.addEventListener('error',e=>bootErr(e.message));
window.addEventListener('unhandledrejection',e=>bootErr(e.reason&&e.reason.message||String(e.reason)));
TOKEN=tokGet();
try{const cc=JSON.parse(localStorage.getItem('er-cfg')||'null');if(cc)applyCfg(cc);}catch(_){}
if(!TOKEN){
  gsCall('publik',null,{}).then(r=>{if(r&&r.ok&&r.data){const b=JSON.stringify(CFG);applyCfg(r.data);if(!S.user&&JSON.stringify(CFG)!==b)render(true);}}).catch(()=>{});
}

if(TOKEN){
  rpc('state').then(()=>{if(S.user){S.tab=tabAwal(S.user.r);S.view=viewAwal(S.user.r);}render();}).catch(e=>{S.user=null;render();if(!/Sesi berakhir/.test(e.message))toast(e.message,'er');});
} else {
  render();
}
</script>
<script>
/* Service Worker bersifat opsional: hanya didaftarkan bila sw.js ada */
if('serviceWorker' in navigator){fetch('sw.js',{method:'HEAD'}).then(function(r){if(r.ok)navigator.serviceWorker.register('sw.js');}).catch(function(){});}
</script>
