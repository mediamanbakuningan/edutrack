<style>
:root{--nav:#00674F;--bg:#f8fafc;--card:#ffffff;--tx:#000000;--mu:#64748b;--bd:#e2e8f0;--pr:#00674F;--pr2:#005340;--ac:#d97706;--ok:#059669;--okb:#ecfdf5;--wa:#b45309;--wab:#fffbeb;--er:#dc2626;--erb:#fef2f2;--sbw:252px;--sbrail:92px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#090d16;--card:#111827;--tx:#f1f5f9;--mu:#94a3b8;--bd:#1f293d;--pr:#2dd4bf;--pr2:#14b8a6;--ok:#34d399;--okb:#064e3b;--wa:#fbbf24;--wab:#451a03;--er:#f87171;--erb:#450a0a}}
:root[data-theme=dark]{--bg:#090d16;--card:#111827;--tx:#f1f5f9;--mu:#94a3b8;--bd:#1f293d;--pr:#2dd4bf;--pr2:#14b8a6;--ok:#34d399;--okb:#064e3b;--wa:#fbbf24;--wab:#451a03;--er:#f87171;--erb:#450a0a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--tx);line-height:1.5;font-size:14px;padding-bottom:50px;animation:fadeInBody .4s ease-out}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h2{font-size:1.3rem;font-weight:700}h3{font-size:1.05rem;font-weight:600}h4{margin:16px 0 8px;font-size:.9rem}
.mu{color:var(--mu);font-size:.82rem}.mt{margin-top:8px}.nw{white-space:nowrap}
.bt{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:block;color:var(--mu);font-size:.72rem}


#sb{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:60;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sb-top{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--bd)}
.sb-top .logo{width:36px;height:36px;border-radius:10px;font-size:.85rem;flex:none}
.brand{font-weight:700;color:var(--pr);font-size:1.02rem;line-height:1.2}
.sb-top .mu{font-size:.72rem;line-height:1.2}
#nav{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--mu);padding:10px 12px;border-radius:8px;font-weight:600;font-size:.88rem;text-align:left;cursor:pointer;transition:background-color .15s,color .15s}
.nv svg{flex:none}
.nv span:first-of-type{flex:1;min-width:0}
.nv:hover{background:var(--bg);color:var(--tx)}
.nv.on{background:rgba(15,118,110,.12);background:color-mix(in srgb,var(--pr) 13%,transparent);color:var(--pr)}
.nv:focus-visible,.sb-foot .btn:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.ng{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:12px 12px 4px}
.ng:first-child{padding-top:2px}
.nb{background:var(--ac);color:#fff;border-radius:99px;font-size:.7rem;font-weight:700;padding:1px 8px;line-height:1.5}
.sb-foot{border-top:1px solid var(--bd);padding:12px 14px}
.sb-foot .usr{line-height:1.25;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-foot .row{margin-top:10px;gap:6px}
.sb-foot .btn{flex:1}
.sb-foot .btn.th{flex:none}
#sbov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
body.has-sb{padding-left:var(--sbw)}

#bnav{display:none;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:0 14px 34px -14px rgba(0,0,0,.4);padding:8px 6px;justify-content:space-around;gap:2px;transition:opacity .2s}
body.sb-open #bnav{opacity:0;pointer-events:none}
.bnv{flex:1;min-width:0;border:0;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:14px;cursor:pointer;font-weight:600;font-size:.62rem;transition:color .15s}
.bnv .bni{display:inline-flex;padding:4px 16px;border-radius:99px;transition:background-color .15s,transform .15s}
.bnv .bnl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
.bnv:not(.on):hover{color:var(--tx)}
.bnv.on{color:var(--pr)}
.bnv.on .bni{background:color-mix(in srgb,var(--pr) 16%,transparent)}
.bnv:active .bni{transform:scale(.94)}
.bnv:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
@media(max-width:860px),(max-width:1024px) and (orientation:portrait){
  body.has-sb{padding-left:0}
  #sb{transform:translateX(-102%);transition:transform .25s cubic-bezier(0.16,1,0.3,1);box-shadow:none;width:min(300px,86vw);border-radius:0 22px 22px 0}
  body.sb-open #sb{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.sb-open #sbov{display:block}
  #bnav{display:flex}
  body.has-bnav{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  body.has-bnav #toasts{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  #app .card{border-radius:18px;box-shadow:0 10px 26px -20px rgba(0,0,0,.3)}
}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 4px 6px -1px rgba(0,0,0,.02);animation:slideUpCard .35s cubic-bezier(0.16,1,0.3,1) both}
.card.sum{border-left:4px solid var(--ac)}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:.86rem;cursor:pointer;background:var(--bd);color:var(--tx);transition:all .2s cubic-bezier(0.4,0,0.2,1)}
.btn:hover{transform:translateY(-1px);filter:brightness(0.97)}
.btn:active{transform:translateY(1px);filter:brightness(0.92)}
.btn:focus-visible,.in:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.btn.pri{background:var(--pr);color:#fff}.btn.pri:hover{background:var(--pr2)}
.btn.ghost{background:transparent;border:1px solid var(--bd)}.btn.ghost:hover{background:var(--bd)}
.btn.dng{background:var(--er);color:#fff}
.btn.sm{padding:6px 12px;font-size:.78rem}.btn.w{width:100%}
.btn:disabled{opacity:.6;cursor:default;transform:none!important}
label{display:block;font-weight:600;font-size:.83rem;margin:14px 0 6px}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:.9rem;transition:border-color .2s, box-shadow .2s}
.in:focus{outline:none;border-color:var(--pr);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
textarea.in{resize:vertical}
input[type=checkbox]{accent-color:var(--pr);width:16px;height:16px;cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:600}
.b-ok{background:var(--okb);color:var(--ok)}.b-wa{background:var(--wab);color:var(--wa)}.b-er{background:var(--erb);color:var(--er)}
.prog{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:12px 0 6px}.prog.sm{height:6px;margin:4px 0;min-width:80px}
.prog i{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .8s cubic-bezier(0.4,0,0.2,1)}.prog.low i{background:var(--ac)}
.note{background:var(--wab);color:var(--wa);padding:12px;border-radius:10px;margin:12px 0;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stat b{display:block;font-size:1.9rem;line-height:1.1}.stat span{color:var(--mu);font-size:.8rem}
.stat.ok{border-left:4px solid var(--ok)}.stat.wa{border-left:4px solid var(--ac)}.stat.er{border-left:4px solid var(--er)}
.big{font-size:2.5rem;font-weight:700;color:var(--pr);line-height:1}
.bar{display:grid;grid-template-columns:minmax(130px,1.4fr) 2fr 48px;gap:12px;align-items:center;font-size:.85rem;margin:6px 0}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:var(--bg);font-weight:600;color:var(--mu);white-space:nowrap}
tr{transition:background-color .15s}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:.75rem;margin:2px}
ul{margin:4px 0 4px 18px}li{margin:2px 0}
.kv{margin:10px 0;padding:8px 0;border-bottom:1px dashed var(--bd)}
.kv b{display:block;font-size:.75rem;color:var(--mu);font-weight:600;margin-bottom:2px}
.dr{display:flex;gap:6px;margin:6px 0;align-items:center}.dr .in{flex:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s ease;padding:16px}
.ov.show{opacity:1;pointer-events:auto}
.mc{background:var(--card);border-radius:18px;padding:24px;width:100%;max-width:580px;max-height:85vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);transform:scale(.92) translateY(10px);transition:transform .25s cubic-bezier(0.16,1,0.3,1)}
.ov.show .mc{transform:scale(1) translateY(0)}
#m-foot{justify-content:flex-end;margin-top:20px}
.sub{border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.login{max-width:400px;margin:40px auto;box-shadow:0 20px 25px -5px rgba(0,0,0,.08)}.login h1{font-size:1.7rem;margin:8px 0}
.logo{width:48px;height:48px;border-radius:12px;background:var(--pr);color:#fff;font-weight:700;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.login{text-align:center}.login .logo{margin:0 auto}.login label{text-align:left}
.pw{position:relative}.pw .in{padding-right:46px}
.pwt{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:8px;background:transparent;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pwt:hover{color:var(--tx)}.pwt:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.trow{display:grid;grid-template-columns:minmax(170px,2.2fr) minmax(120px,1fr) minmax(150px,1.2fr) auto;gap:8px;align-items:end}
.gd summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:8px}
.gd summary::-webkit-details-marker{display:none}
.gd summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .2s;flex:none;margin:0 4px 4px 0}
.gd[open] summary::after{transform:rotate(-135deg);margin:4px 4px 0 0}
.gd summary:focus-visible{outline:2px solid var(--pr);outline-offset:3px}
.sl{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sl .badge,.sl .mu{flex:none}
.jnr{display:grid;grid-template-columns:minmax(0,2fr) 84px 92px 92px auto;gap:8px;align-items:end;margin-top:10px}
.jn-f{display:flex;flex-direction:column;gap:3px;margin:0;min-width:0}
.jn-f span{font-size:.68rem;color:var(--mu);font-weight:600;line-height:1.2}
.jnr .in{padding:8px 10px;min-width:0}
@media(max-width:640px){.jnr{grid-template-columns:repeat(3,minmax(0,1fr)) auto;padding:10px;border:1px solid var(--bd);border-radius:12px}.jn-fn{grid-column:1/-1}}
.kpl{display:grid;gap:8px;max-height:60vh;overflow:auto}
.kpo{display:flex;gap:10px;align-items:flex-start;margin:0;padding:10px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-weight:500}
.kpo input{margin-top:6px;flex:none}
.kpo:has(input:checked){border-color:var(--pr);box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 25%,transparent)}
.kpb{flex:1;min-width:0}
.kpn{font-weight:700;margin-bottom:6px}
.kpb>div:last-child{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px}
.frow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:8px}
.frow.o{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.5fr) auto}
.frow .in{padding:8px 10px;min-width:0}
.gd .gb{margin-top:14px;border-top:1px solid var(--bd);padding-top:12px}
.trow label{display:block;margin:0 0 4px;font-size:.74rem;font-weight:600;color:var(--mu)}
.trow .cbx{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-weight:500;font-size:.8rem;color:var(--tx);white-space:nowrap;cursor:pointer}
.trow .btn{align-self:end}
#ld{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pr),var(--ac),var(--pr));background-size:200% 100%;z-index:400;animation:loadingBarShimmer 1.2s linear infinite}
#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;z-index:300}
.toast{background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;margin-top:10px;font-size:.86rem;max-width:340px;box-shadow:0 15px 25px -5px rgba(0,0,0,.2);animation:toastSlideIn .3s cubic-bezier(0.16,1,0.3,1) forwards}
.toast.ok{background:#059669}.toast.er{background:#dc2626}
@keyframes fadeInBody{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUpCard{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastSlideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes loadingBarShimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.pak2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:860px){.pak2{grid-template-columns:1fr}}

.ib{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;flex:none}
.ib svg{width:16px;height:16px;flex:none}
.btn.ib{padding:0} 
.ib.del{color:var(--er)}.ib.del:hover{background:var(--erb)}
.acts{display:flex;gap:4px;justify-content:flex-end}
.tu td,.tu th{overflow-wrap:anywhere}
.tu th:last-child,.tu td:last-child{width:1%;white-space:nowrap}
.ctr{text-align:center}
.ta td:last-child,.ta th:last-child{width:48%}
.ta .in{padding:8px 10px}
.dnav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dnav .in{width:auto}

.att-i{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;background:var(--bg)}
.att-i svg{flex:none;color:var(--mu)}
.att-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.84rem;font-weight:500}
.att-i .btn{flex:none}
.att-p{border:1px solid var(--bd);border-radius:10px;margin:8px 0;background:var(--bg);overflow:hidden}
.att-p .att-i{border:0;margin:0;border-radius:0;background:transparent}
.att-pv{padding:0 10px 10px}
.att-img{display:block;max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--bd);background:#fff;margin:0 auto}
.att-tx{white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto;font-size:.76rem;line-height:1.45;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace}
.att-cv{display:block;max-width:100%;border:1px solid var(--bd);border-radius:8px;margin:0 auto 8px;background:#fff}

.skl{position:relative;overflow:hidden;background:var(--bd);border-radius:8px;height:14px;margin:10px 0}
.skl::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sklMove 1.4s infinite}
@keyframes sklMove{100%{transform:translateX(100%)}}

.mcl{display:flex;flex-direction:column;gap:10px}
.mcard{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.mcl-b{min-width:0}
.tap{cursor:pointer}
.mcard.tap{transition:border-color .15s,box-shadow .15s,transform .15s}
.mcard.tap:hover{border-color:var(--pr);box-shadow:0 4px 14px -6px rgba(0,0,0,.18)}
.mcard.tap:active{transform:scale(.985)}
.tap:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.mc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}
.mc-h>div{min-width:0}
.mc-h b{overflow-wrap:anywhere}
.mc-sub{color:var(--mu);font-size:.8rem;margin-top:2px;overflow-wrap:anywhere}
.mc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.mc-more{color:var(--pr);font-size:.78rem;font-weight:600}
.mc-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.mbody{white-space:pre-wrap;overflow-wrap:anywhere}

.nl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.nl-it{display:flex;flex-direction:column;gap:3px;margin:0;min-width:0}
.nl-it span{font-size:.68rem;color:var(--mu);font-weight:600;line-height:1.2}
.nl-it .in{padding:7px 6px;text-align:center;font-weight:600}
@media(max-width:860px){
  body{font-size:13.5px}
  h2{font-size:1.15rem}
  th,td{padding:10px 9px}
  .ib{width:30px;height:30px}.ib svg{width:15px;height:15px}
  .card{padding:16px}
}
@media(max-width:640px){
  .frow .in{padding:7px 8px;font-size:.78rem}
  .sl .mu{display:none}
  body{font-size:13px}
  h2{font-size:1.05rem}h3{font-size:.98rem}
  .wrap{padding:12px}
  .card{padding:12px;border-radius:12px}
  .tu{font-size:.76rem}
  .tu th,.tu td{padding:7px 5px}

function cfgLogo(inp){
  const f=inp.files[0];inp.value='';if(!f)return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast('Logo harus berformat PNG, JPG, atau WebP','er');
  if(f.size>5e6)return toast('Ukuran file maksimal 5 MB','er');
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const m=256,sc=Math.min(1,m/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*sc)),h=Math.max(1,Math.round(im.height*sc));
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
      let data=c.toDataURL('image/png');
      if(data.length>110000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);data=c.toDataURL('image/jpeg',.85);}
      if(data.length>120000)return toast('Logo terlalu besar setelah diproses, gunakan gambar yang lebih sederhana','er');
      cfgIn('logo',data);
    };
    im.onerror=()=>toast('Gambar tidak dapat dibaca','er');
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}

function kopPdf(doc,W,ML,MR){
  const K=kopCur(),top=15,sc=W>250?1.1:1;
  const dim=(logo,r)=>{if(!logo)return{w:0,h:0};r=r||1;let h=20*sc,w=h/r;if(w>32*sc){w=32*sc;h=w*r;}return{w:w,h:h};};
  const A=dim(K.logoL,K.rL),B=dim(K.logoR,K.rR);
  const gl=A.w?A.w+4:0,gr=B.w?B.w+4:0,al=K.align||'center',sym=Math.max(gl,gr);
  const left=ML+gl,right=W-MR-gr;
  const ax=al==='left'?left:al==='right'?right:(ML+W-MR)/2;
  const wrapW=al==='center'?W-ML-MR-2*sym:right-left;
  const items=[];
  [[K.yayasan,15*sc,true,6.5*sc],[K.madrasah,14*sc,true,5.8*sc],[K.alamat,10*sc,false,4.5*sc]].forEach(p=>{
    if(!p[0])return;
    doc.setFont('times',p[2]?'bold':'normal');doc.setFontSize(p[1]);
    doc.splitTextToSize(String(p[0]),wrapW).forEach(l=>items.push({l,sz:p[1],b:p[2],lh:p[3]}));
  });
  const textH=items.reduce((a,i)=>a+i.lh,0),blockH=Math.max(textH,A.h,B.h);
  const img=(d,x,o)=>{try{doc.addImage(d,/^data:image\/png/.test(d)?'PNG':'JPEG',x,top+(blockH-o.h)/2,o.w,o.h);}catch(e){}};
  if(A.w)img(K.logoL,ML,A);
  if(B.w)img(K.logoR,W-MR-B.w,B);
  let cur=top+(blockH-textH)/2;
  doc.setTextColor(0,0,0);
  items.forEach(i=>{
    doc.setFont('times',i.b?'bold':'normal');doc.setFontSize(i.sz);
    doc.text(i.l,ax,cur+i.lh*0.8,{align:al});cur+=i.lh;
  });
  const ly=top+blockH+2;
  doc.setDrawColor(0,0,0);doc.setLineWidth(.8);doc.line(ML,ly,W-MR,ly);
  doc.setLineWidth(.2);doc.line(ML,ly+1.2,W-MR,ly+1.2);
  return ly+1.2;
}
function savePdf(o){
  const doc=new window.jspdf.jsPDF({orientation:o.land?'landscape':'portrait',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  let y=kopPdf(doc,W,10,10)+8;
  doc.setFont('times','bold');doc.setFontSize(12);doc.setTextColor(0,0,0);doc.text(o.title,W/2,y,{align:'center'});
  y+=6;doc.setFont('times','normal');doc.setFontSize(9.5);doc.setTextColor(71,85,105);
  if(o.sub)doc.text(o.sub,W/2,y,{align:'center'});
  const cs={};(o.widths||[]).forEach((w,i)=>cs[i]={cellWidth:w});
    if(o.widths&&o.widths.length){
    const avail=W-20,sum=o.widths.reduce((a,b)=>a+b,0);
    if(sum>0&&Math.abs(sum-avail)>0.5){const k=avail/sum;(o.widths||[]).forEach((w,i)=>{cs[i]=Object.assign(cs[i]||{},{cellWidth:w*k});});}
  }
  (o.ctr||[]).forEach(i=>{cs[i]=Object.assign(cs[i]||{},{halign:'center'});});
  doc.autoTable({startY:y+4,head:[o.head],body:o.body,theme:'grid',margin:{left:10,right:10,bottom:14},
    styles:{font:'times',fontSize:o.fs||9,cellPadding:o.cp==null?2:o.cp,overflow:'linebreak',valign:'top',lineColor:[150,150,150],lineWidth:.2,textColor:[0,0,0]},
    headStyles:{font:'times',fontStyle:'bold',fillColor:[230,230,230],textColor:[0,0,0],fontSize:o.fs||9,halign:'center',valign:'middle'},columnStyles:cs,
    didParseCell:d=>{if(d.section==='head')d.cell.styles.halign='center';}});
  if(o.note){
    let yy=doc.lastAutoTable.finalY+6;
    if(yy>H-24){doc.addPage();yy=14;}
    doc.setFont('times','normal');doc.setFontSize(9);doc.setTextColor(71,85,105);
    doc.text(doc.splitTextToSize(o.note,W-20),10,yy);
  }
  doc.save(o.name);
}

const ATT_PX=1600,ATT_IMG_MAX=15*1024*1024;
function imgShrink(f){
  if(!/^(jpg|jpeg|png)$/.test(attExt(f.name))||f.size<200*1024)return Promise.resolve(f);
  if(!window.createImageBitmap)return imgShrinkOld(f);
  return createImageBitmap(f).then(bm=>new Promise(ok=>{
    const s=Math.min(1,ATT_PX/Math.max(bm.width,bm.height)),w=Math.max(1,Math.round(bm.width*s)),h=Math.max(1,Math.round(bm.height*s));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(bm,0,0,w,h);
    if(bm.close)bm.close();
    c.toBlob(b=>ok(!b||b.size>=f.size?f:{name:f.name.replace(/\.[^.]+$/,'')+'.jpg',size:b.size,blob:b}),'image/jpeg',.82);
  })).catch(()=>imgShrinkOld(f));
}
function imgShrinkOld(f){
  return new Promise(ok=>{
    if(!/^(jpg|jpeg|png)$/.test(attExt(f.name))||f.size<200*1024)return ok(f);
    const fr=new FileReader();
    fr.onerror=()=>ok(f);
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>ok(f);
      im.onload=()=>{
        const s=Math.min(1,ATT_PX/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        c.toBlob(b=>{if(!b||b.size>=f.size)return ok(f);ok({name:f.name.replace(/\.[^.]+$/,'')+'.jpg',size:b.size,blob:b});},'image/jpeg',.82);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}
const toB64=x=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]||'');fr.onerror=()=>no(new Error('Berkas tidak dapat dibaca'));fr.readAsDataURL(x.blob||x);});
async function attAdd(inp){
  const fs=[...inp.files];inp.value='';
  if(!fs.length)return;
  const g=S.user.id,t=S.tugasId,per0=S.vp;
  const kept=attOld(g,t).filter(a=>KEEP.indexOf(a.id)>=0);
  let cnt=kept.length+PF.length,tot=kept.reduce((a,x)=>a+(+x.s||0),0)+PF.reduce((a,x)=>a+x.s,0);
  ATT_BUSY++;attRefresh();
  try{
    for(const f of fs){
      const img=/^(jpg|jpeg|png)$/.test(attExt(f.name));
      if(ATT_EXT.indexOf(attExt(f.name))<0){toast('Jenis berkas "'+f.name+'" tidak diizinkan','er');continue;}
      if(f.size>(img?ATT_IMG_MAX:ATT_BYTES)){toast('Berkas "'+f.name+'" terlalu besar (maks. '+(img?'15':'5')+' MB)','er');continue;}
      if(cnt+1>ATT_MAX){toast('Maksimal '+ATT_MAX+' lampiran per laporan','er');break;}
      const p=await imgShrink(f);
      if(p.size>ATT_BYTES){toast('Berkas "'+f.name+'" melebihi 5 MB','er');continue;}
      if(tot+p.size>ATT_TOTAL){toast('Total ukuran lampiran melebihi 8 MB','er');break;}
      const d=await toB64(p),it={n:p.name,s:p.size,st:'up'};
      PF.push(it);cnt++;tot+=p.size;attRefresh();
      attUp(it,d,per0,t);
    }
  }catch(e){toast(e.message,'er');}
  finally{ATT_BUSY--;attRefresh();}
}
function attUp(it,d,per0,t){
  rpc('lampUpload',{periode:per0,tugasId:t,n:it.n,d}).then(r=>{
    const m=r.info||{};
    if(it.x){rpc('lampBatal',{fileId:m.id}).catch(()=>{});return;}
    it.id=m.id;it.st='ok';attRefresh();
  }).catch(e=>{
    if(it.x)return;
    it.st='err';it.e=e.message;attRefresh();toast('Gagal mengunggah "'+it.n+'": '+e.message,'er');
  });
}
function attDl(p,g,t,id){
  toast('Menyiapkan berkas…');
  rpc('lampiranGet',{periode:p,guruId:g,tugasId:t,fileId:id}).then(r=>{
    const i=r.info||{};
    const bin=atob(i.d||''),u8=new Uint8Array(bin.length);
    for(let x=0;x<bin.length;x++)u8[x]=bin.charCodeAt(x);
    const url=URL.createObjectURL(new Blob([u8],{type:i.t||'application/octet-stream'}));
    const a=document.createElement('a');a.href=url;a.download=i.n||'lampiran';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);

}
let ATC={};
const attKind=n=>{const e=attExt(n);return /^(jpg|jpeg|png)$/.test(e)?'img':e==='pdf'?'pdf':e==='txt'?'txt':'file';};
function b64Blob(d,t){const bin=atob(d||''),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return new Blob([u8],{type:t||'application/octet-stream'});}
function attFetch(p,g,t,id){
  if(ATC[id])return Promise.resolve(ATC[id]);
  return rpc('lampiranGet',{periode:p,guruId:g,tugasId:t,fileId:id}).then(r=>{
    const i=r.info||{},b=b64Blob(i.d,i.t),k=attKind(i.n),o={n:i.n,t:i.t};
    if(k==='img'){o.src='data:'+(i.t||'image/jpeg')+';base64,'+i.d;return(ATC[id]=o);}
    if(k==='txt')return b.text().then(tx=>{o.tx=tx;return(ATC[id]=o);});
    if(k==='pdf')return b.arrayBuffer().then(buf=>{o.buf=buf;return(ATC[id]=o);});
    return(ATC[id]=o);
  });
}

const PDFJS_V='3.11.174',PDFJS_CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/';
let pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  if(pdfjsP)return pdfjsP;
  return(pdfjsP=new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=PDFJS_CDN+'pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_CDN+'pdf.worker.min.js';ok();}catch(e){pdfjsP=null;no(e);}};
    s.onerror=()=>{pdfjsP=null;no(new Error('Pustaka pratinjau PDF belum termuat. Periksa koneksi internet.'));};
    document.head.appendChild(s);
  }));
}
function attPdf(p,g,t,id){

function save(s){
  const t=T.find(x=>x.id===S.tugasId),g=S.user.id,fs=tp(t);
  if(locked(S.vp,g))return toast('Pengisian sedang dikunci','er');
  const d={};
  fs.forEach(f=>{
    if(f.type==='poin')d[f.key]=[...document.querySelectorAll(`#ff [data-l="${f.key}"]`)].map(e=>e.value.trim()).filter(Boolean);
    else{const e=document.querySelector(`#ff [data-k="${f.key}"]`);d[f.key]=e?e.value.trim():'';}
  });
  let err='';
  for(const f of fs){const v=d[f.key];
    if(f.type==='number'&&v!==''&&(isNaN(+v)||+v<0)){err=`"${f.label}" harus berupa angka 0 atau lebih`;break;}
    if(f.key==='persen'&&v!==''&&(+v<0||+v>100)){err='Capaian harus antara 0 dan 100';break;}
    if(s==='TERKIRIM'&&f.required&&(f.type==='poin'?!v.length:v==='')){err=`"${f.label}" wajib diisi`;break;}
  }
  if(!err&&s==='TERKIRIM'&&d.persen!==undefined&&d.persen!==''&&+d.persen<75&&['kendala','solusi'].some(k=>fs.some(f=>f.key===k&&f.type==='poin')&&!d[k].length))err='Capaian di bawah 75% wajib diisi kendala dan solusinya';
  if(err)return toast(err,'er');
  if(SAVING)return;
  if(ATT_BUSY||PF.some(f=>f.st==='up'))return toast('Tunggu sebentar, lampiran masih diunggah','er');
  if(PF.some(f=>f.st==='err'))return toast('Ada lampiran yang gagal diunggah. Hapus lalu pilih ulang berkasnya.','er');
  SAVING=true;
  run('saveLaporan',{periode:S.vp,tugasId:t.id,status:s,data:d,pend:PF.map(f=>f.id),keep:KEEP.slice()},s==='DRAFT'?'Draft tersimpan':'Laporan terkirim',()=>{S.view='dash';PF=[];KEEP=[];}).finally(()=>{SAVING=false;});
}

function hariEfektif(bln){
  const m=/^(\d{4})-(\d{2})$/.exec(bln||'');if(!m)return[];
  const y=+m[1],mo=+m[2],last=new Date(y,mo,0).getDate(),out=[];
  for(let d=1;d<=last;d++){const dt=new Date(y,mo-1,d),w=dt.getDay();if(w>=1&&w<=5)out.push(y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'));}
  return out;
}
function hariEkskulBln(bln,h){
  const m=/^(\d{4})-(\d{2})$/.exec(bln||'');if(!m||!(+h>=1&&+h<=7))return[];
  const y=+m[1],mo=+m[2],jd=+h%7,last=new Date(y,mo,0).getDate(),out=[];
  for(let d=1;d<=last;d++){const dt=new Date(y,mo-1,d);if(dt.getDay()===jd)out.push(y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'));}
  return out;
}

    head:['No','Anggota','Kelas'].concat(dts.map(t=>generik?t:String(+t.slice(8,10)))).concat(['H','I','S','A','%']),
    body:(AXR.rows||[]).map((x,i)=>[i+1,x.n,x.k||'-'].concat(dts.map(t=>generik?'':absPdfCell(x.cells[t]))).concat([x.c.Hadir,x.c.Izin,x.c.Sakit,x.c.Alpa,x.pct===null?'-':x.pct+'%'])),
    widths:[7,40,18].concat(dts.map(()=>per)).concat([11,11,11,11,14]),
    ctr:ctr,fs:8,cp:1,

function rkJenis(D){

    if(pa){PRKB=false;PRK={gr:[],js:[]};}else{SRKB=false;SRK={gr:[]};}

function guruCardHTML(g,open){
  const gTasks=T.filter(t=>t.g.includes(g.id));
  const key=(g.n+' '+g.u).toLowerCase(),q=S.qt.trim().toLowerCase();
  return`<details class="card gd" id="card-g-${g.id}" data-n="${esc(key)}" ${open?'open':''} ${key.indexOf(q)>=0?'':'hidden'}>`+
    `<summary><div><b>${esc(g.n)}</b><div class="mu">${esc(g.u)} · ${gTasks.length} tugas</div></div></summary>`+
    `<div class="gb"><div class="row" style="justify-content:flex-end"><button class="btn pri sm" onclick="saveGuruTugas('${g.id}')">Simpan tugas guru ini</button></div>`+
    `<div class="mt" id="gt-list-${g.id}">`+
    (gTasks.length?gTasks.map(renderTaskRow).join(''):'<p class="mu">Belum ada tugas untuk guru ini.</p>')+
    `</div>`+
    `<div class="mt"><button class="btn ghost sm" onclick="addTaskRow('${g.id}')">+ Tambah tugas</button></div></div>`+
  `</details>`;
}
function renderTaskRow(t){
  const tplKeys=Object.keys(TPL).filter(k=>TJ[k]===t.j);
  let opts=tplKeys.map(k=>`<option value="${esc(k)}" ${t.c===k?'selected':''}>${esc(k)}</option>`).join('');
  if(!tplKeys.length)opts='<option value="">(belum ada template)</option>';
  if(t.c&&tplKeys.indexOf(t.c)<0)opts=`<option value="${esc(t.c)}" selected>${esc(t.c)} (jenis tidak cocok)</option>`+opts;
  return`<div class="trow sub">`+
    `<input type="hidden" class="tk-id" value="${esc(t.id||'')}">`+
    `<div class="tc-nama"><label>Nama tugas</label><input class="in tk-nama" value="${esc(t.n||'')}" placeholder="Contoh: Mengajar Matematika X-A"></div>`+
    `<div><label>Jenis</label><select class="in tk-jenis" onchange="updateTplSelect(this)">${JENIS.map(j=>`<option value="${j}" ${t.j===j?'selected':''}>${JLABEL(j)}</option>`).join('')}</select></div>`+
    `<div><label>Template isian</label><select class="in tk-kat">${opts}</select></div>`+
    `<button type="button" class="btn ghost ib del" onclick="this.closest('.trow').remove()" aria-label="Hapus tugas" title="Hapus tugas">${ico('trash')}</button>`+
  `</div>`;
}
function addTaskRow(gid){
  const c=$('gt-list-'+gid);if(!c)return;
  const keys=Object.keys(TPL);
  if(!keys.length)return toast('Belum ada template isian. Buat dulu di menu "Template isian".','er');
  const ph=c.querySelector('p.mu');if(ph)ph.remove();
  const firstM=keys.filter(k=>TJ[k]==='MENGAJAR')[0]||keys[0];
  c.insertAdjacentHTML('beforeend',renderTaskRow({id:'',n:'',j:TJ[firstM]||'NON-MENGAJAR',c:firstM}));
}
function updateTplSelect(sel){
  const row=sel.closest('.trow');if(!row)return;
  const kat=row.querySelector('.tk-kat');if(!kat)return;
  const j=sel.value,cur=kat.value;
  const keys=Object.keys(TPL).filter(k=>TJ[k]===j);
  kat.innerHTML=keys.map(k=>`<option value="${esc(k)}" ${k===cur?'selected':''}>${esc(k)}</option>`).join('')||'<option value="">(belum ada template)</option>';
}
function saveGuruTugas(gid){
  const c=$('gt-list-'+gid);if(!c)return;
  const tasks=[];
  for(const r of c.querySelectorAll('.trow')){
    const nama=r.querySelector('.tk-nama').value.trim();
    if(!nama)continue;
    const kategori=r.querySelector('.tk-kat').value;
    if(!kategori)return toast('Tugas "'+nama+'" belum punya template isian. Pilih template atau hapus barisnya.','er');
    tasks.push({id:r.querySelector('.tk-id').value.trim(),nama,jenis:r.querySelector('.tk-jenis').value,kategori,aktif:'1'});
  }
  const curIds=T.filter(t=>t.g.includes(gid)).map(t=>t.id);
  const removed=curIds.filter(id=>!tasks.some(x=>x.id===id));
  const doSave=()=>rpc('saveTugas',{guruId:gid,tasks}).then(()=>{
    toast('Tugas guru tersimpan','ok');
    rebuildGuruCard(gid);
  }).catch(e=>toast(e.message,'er'));
  if(removed.length)confirmM('Lepaskan tugas',`${removed.length} tugas lama akan dilepaskan dari guru ini, dan dihapus bila tidak dipakai guru lain. Lanjutkan?`,doSave);
  else doSave();
}
function rebuildGuruCard(gid){
  const el=$('card-g-'+gid),g=G.find(x=>x.id===gid);
  if(el&&g)el.outerHTML=guruCardHTML(g,el.open);
}

const wkField=sel=>`<div id="u-wk-w" style="display:${sel?'':'none'}"><label for="u-wk">Kelas binaan (wali kelas)</label><select id="u-wk" class="in"><option value="">— Pilih kelas —</option>${kelasUnik().map(k=>`<option ${k===sel?'selected':''}>${esc(k)}</option>`).join('')}</select><p class="mu" style="margin-top:4px">Role Wali kelas hanya bisa disematkan pada user dengan hak akses Guru. Absensi kelas, Ranking antar kelas &amp; Ranking antar siswa kini ada di Dashboard dan dapat dilihat semua pengguna kecuali wali murid.</p></div>`;

const ib=(c,fn,i,t)=>`<button class="btn ghost ib ${c}" onclick="${fn}" aria-label="${t}" title="${t}">${ico(i)}</button>`;

  (G.map(g=>`<tr><td><b>${esc(g.u)}</b><td>${esc(g.n)}<td class="hm2">${roleBadge(rsOf(g).join(','))}<td class="hm">${hasR(g,'GURU')?units(g.id).length:'—'}<td>${sdBadge(g)}<td><div class="acts">${ib('',`uModal('${g.id}')`,'edit','Ubah user')}${ib('',`resetUn('${g.id}')`,'idreset','Reset username')}${hasR(g,'ADMIN')?'':ib('',`resetPw('${g.id}')`,'key','Reset sandi')+ib('del',`delU('${g.id}')`,'trash','Hapus user')}</div>`).join('')||'<tr><td colspan="6" class="mu">Belum ada user.</tr>')+

function uDet(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  modal('Detail user',
    kv('Nama',esc(g.n))+kv('Username','<b>'+esc(g.u)+'</b>')+kv('Peran',roleBadge(rsOf(g).join(','))||'-')+(hasR(g,'WALIKELAS')?kv('Kelas binaan',esc(g.wk||'-')):'')+kv('Tugas aktif',hasR(g,'GURU')?String(units(g.id).length):'—')+kv('Status sandi',sdBadge(g)),
    [{t:'Tutup',c:'ghost',f:()=>closeM()}]);
}
function uModal(id){
  const g=G.find(x=>x.id===id);
  const isEdit=!!g;
  modal(isEdit?'Ubah user':'Tambah user',
    isEdit
      ?`<p class="mu">${roleBadge(rsOf(g).join(','))}</p>`+
       `<label for="u-n">Nama lengkap dan gelar</label><input id="u-n" class="in" value="${esc(g.n)}">`+(hasR(g,'ADMIN')?'':rolePick(rsOf(g))+wkField(g.wk||''))+
       `<label for="u-u">Username</label><input id="u-u" class="in" value="${esc(g.u)}" autocomplete="off">`+
       `<label for="u-p">Kata sandi (kosongkan jika tidak diubah)</label><input id="u-p" class="in" type="text" autocomplete="off" placeholder="Biarkan kosong = tidak diubah">`
      :`<label for="u-n">Nama lengkap dan gelar</label><input id="u-n" class="in" placeholder="Contoh: Muhammad Nur Pauzi, S.Pd.">`+
       rolePick(['GURU'])+
       wkField('')+
       `<label for="u-p">Kata sandi (opsional)</label><input id="u-p" class="in" type="text" autocomplete="off" placeholder="Default: 123456">`,
  [CANCEL,{t:'Simpan',c:'pri',f:()=>{
    const n=$('u-n').value.trim();
    if(!n)return toast('Nama wajib diisi','er');
    const wkOf=()=>pickedRoles().indexOf('WALIKELAS')>=0?((($('u-wk'))?$('u-wk').value:'')||''):'';
    if(!isEdit){
      const rs=pickedRoles(),p=$('u-p').value;
      if(!rs.length)return toast('Pilih minimal satu hak akses','er');
      if(rs.indexOf('WALIKELAS')>=0&&rs.indexOf('GURU')<0)return toast('Role Wali kelas hanya bisa disematkan pada user dengan hak akses Guru','er');
      if(rs.indexOf('WALIKELAS')>=0&&!wkOf())return toast('Pilih kelas binaan untuk role Wali kelas','er');
      if(p&&p.length<6)return toast('Kata sandi minimal 6 karakter','er');
      closeM();
      rpc('saveUser',{id:'',n,rs,p,wk:wkOf()}).then(res=>{
        const info=(res&&res.info)||{};
        render();
        modal('Username dibuat otomatis',
          `<div class="sub" style="margin:0"><div class="mu">Nama</div><b>${esc(n)}</b><div class="mu" style="margin-top:10px">Username</div><div style="font-size:1.5rem;font-weight:700;color:var(--pr)">${esc(info.username||'')}</div><p class="mu mt">Sandi awal: ${esc(info.pw||PWD[rs[0]]||'123456')} — disarankan diganti setelah masuk (lewat tombol Akun). Sampaikan username &amp; sandi ini kepada yang bersangkutan.</p></div>`,
          [{t:'Tutup',c:'ghost',f:()=>closeM()}]);
      }).catch(e=>toast(e.message,'er'));
    }else{
      const uu=$('u-u').value.trim().toLowerCase(),p=$('u-p').value;
      if(uu&&!/^[a-z0-9._@-]{3,60}$/.test(uu))return toast('Username 3-60 karakter: huruf kecil, angka, titik, garis bawah, strip','er');
      if(G.some(x=>x.u===uu&&x.id!==id))return toast('Username sudah dipakai user lain','er');
      if(p&&p.length<6)return toast('Kata sandi minimal 6 karakter','er');
      const rs=hasR(g,'ADMIN')?undefined:pickedRoles();
      if(rs&&!rs.length)return toast('Pilih minimal satu hak akses','er');
      if(rs&&rs.indexOf('WALIKELAS')>=0&&rs.indexOf('GURU')<0)return toast('Role Wali kelas hanya bisa disematkan pada user dengan hak akses Guru','er');
      if(rs&&rs.indexOf('WALIKELAS')>=0&&!wkOf())return toast('Pilih kelas binaan untuk role Wali kelas','er');
      closeM();run('saveUser',{id,n,u:uu,p,rs,wk:wkOf()},'Data user tersimpan');
    }
  }}]);
}
function resetUn(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  confirmM('Reset username',`Username untuk ${g.n} (sekarang: ${g.u}) akan dibuat ulang otomatis berdasarkan namanya. Login berikutnya memakai username baru; sesi yang sedang berjalan tidak terputus. Lanjutkan?`,()=>{
    rpc('resetUsername',{id}).then(r=>{
      const un=(r&&r.info&&r.info.username)||'';
      render();
      modal('Username baru',
        `<div class="sub" style="margin:0"><div class="mu">Nama</div><b>${esc(g.n)}</b><div class="mu" style="margin-top:10px">Username baru</div><div style="font-size:1.5rem;font-weight:700;color:var(--pr)">${esc(un)}</div><p class="mu mt">Sampaikan username baru ini kepada yang bersangkutan (username lama tidak berlaku lagi).</p></div>`,
        [{t:'Tutup',c:'ghost',f:()=>closeM()}]);
    }).catch(e=>toast(e.message,'er'));
  });
}
function resetUnAll(){

  if(!nGP)return toast('Belum ada user guru/pimpinan.','er');

      render();

    }).catch(e=>toast(e.message,'er')));
}
function resetPwAll(thenDownload){
  const nGP=G.filter(g=>hasR(g,'GURU')||hasR(g,'PIMPINAN')).length;
  if(!nGP)return toast('Belum ada user guru/pimpinan.','er');
  confirmM('Reset sandi massal',
    `SEMUA kata sandi ${nGP} user guru & pimpinan akan direset ke default (123456) — termasuk yang sudah diganti sendiri. Semua sesi aktif mereka langsung terputus dan mereka bisa menggantinya setelah masuk. Akun admin tidak terpengaruh. Lanjutkan?`,
    ()=>run('resetSandiMassal',{},r=>r&&r.info?`${r.info.n||0} sandi direset ke default`:'Selesai',
      ()=>{ if(thenDownload)unduhKred(); }));
}
function unduhKred(){
  if(needP(unduhKred,arguments))return;
  const target=G.filter(g=>hasR(g,'GURU')||hasR(g,'PIMPINAN'));
  if(!target.length)return toast('Belum ada user guru/pimpinan untuk diunduh.','er');
  const perluReset=target.some(g=>g.sd!=='default');
  const doDownload=()=>{
    const body=[];
    let no=0;
    target.forEach(g=>{
      const def=PWD[rsOf(g)[0]]||'123456';
      body.push([++no,g.n,g.u,rsOf(g).map(r=>ROLE_L[r]||r).join(', '),g.sd==='admin'?'(ditetapkan admin)':def]);
    });
    savePdf({land:false,title:'Lembar Username & Sandi Awal',sub:'Dicetak '+today()+' | Rahasiakan lembar ini; bagikan hanya kepada yang bersangkutan.',
      head:['No','Nama','Username','Peran','Sandi awal'],body,widths:[10,66,40,34,40],
      note:'Catatan: sandi awal disarankan diganti setelah login. Untuk user yang sudah mengganti sandinya sendiri, jalankan Reset sandi massal agar sandi awal di lembar ini berlaku.',
      name:'kredensial-user-'+today()+'.pdf'});
    toast('PDF kredensial diunduh','ok');
  };
  if(perluReset){
    modal('Unduh PDF username & sandi',
      '<p class="mu">Sebagian user belum memakai sandi default (sudah diganti sendiri atau ditetapkan admin), sehingga kolom "sandi awal" belum berlaku bagi mereka. Disarankan menjalankan <b>Reset sandi massal</b> agar semua kembali ke default sebelum lembar ini dibagikan.</p>',
      [CANCEL,
       {t:'Reset sandi massal dulu',c:'pri',f:()=>{closeM();resetPwAll(true);}},
       {t:'Tetap unduh',c:'ghost',f:()=>{closeM();doDownload();}}]);
  } else doDownload();
}
function resetPw(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  if(hasR(g,'ADMIN'))return toast('Akun admin direset lewat fungsi pemilik resetAdminPassword().','er');
  const def=PWD[rsOf(g)[0]]||'123456';
  confirmM('Reset kata sandi',`Kata sandi ${g.n} akan direset menjadi default (${def}).`,()=>run('resetSandi',{id},'Kata sandi direset ke default'));
}
function delU(id){
  const g=G.find(x=>x.id===id);if(!g)return;
  if(hasR(g,'ADMIN'))return toast('Akun admin tidak dapat dihapus.','er');
  if(hasR(g,'GURU')&&T.some(t=>t.g.includes(id)))return toast('User masih terikat tugas. Lepaskan tugasnya dulu di menu Master tugas.','er');
  confirmM('Hapus user',`Hapus ${gname(id)}?`,()=>run('delUser',{id},'User dihapus'));
}
function namaTplX(){
  if(needX())return;
  const ws=XLSX.utils.aoa_to_sheet([['Nama lengkap dan gelar'],['Muhammad Nur Pauzi, S.Pd.']]);
  ws['!cols']=[{wch:46}];ws['!ref']='A1:A200';
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Nama');XLSX.writeFile(wb,'template-impor-nama.xlsx');
}
function upGuru(inp){
  readX(inp,wb=>{
    const r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const out=r.filter((x,i)=>!(i===0&&/nip|username|nama/i.test(String(x[0])))).map(x=>{
      const b=String(x[1]||'').trim();
      return (b?b:String(x[0]||'')).trim();
    }).filter(x=>x&&x.length>=3);
    const impEl=$('imp');if(impEl)impEl.value=out.join('\n');
    toast(out.length+' baris terbaca. Klik Impor untuk menyimpan.',out.length?'ok':'er');
  });
}
function showUnModal(title,rows,note){
  modal(title,
    (isMob()
      ?(rows.map(x=>`<div class="mcard" style="margin-bottom:8px"><b>${esc(x[0])}</b><div class="mc-sub">${esc(x[1]||'')}</div>${x[2]?`<div class="mc-chips">${roleBadge(String(x[2]))}</div>`:''}</div>`).join('')||'<p class="mu">Tidak ada.</p>')
      :`<div class="tw"><table><thead><tr><th>Username<th>Nama<th>Peran</thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x[0])}</b><td>${esc(x[1]||'')}<td>${x[2]?roleBadge(String(x[2])):''}`).join('')||'<tr><td colspan="3" class="mu">Tidak ada.</tr>'}</tbody></table></div>`)
    +(note?`<p class="mu mt">${note}</p>`:''),[{t:'Tutup',c:'ghost',f:()=>closeM()}]);
}
function impM(){
  modal('Impor daftar guru',

    '<div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="namaTplX()">Unduh template Excel</button><button class="btn ghost sm" onclick="$(\'xg\').click()">Unggah Excel</button><input id="xg" type="file" accept=".xlsx,.xls" hidden onchange="upGuru(this)"></div>'+

      toast(`Berhasil: ${info.n||0} ditambahkan, ${info.skip||0} dilewati`,'ok');

    }).catch(e=>toast(e.message,'er'));
  }}]);
}

const tk=ci=>Object.keys(TPL)[ci];
function aTpl(){
  const keys=Object.keys(TPL);
  return`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>Template isian</h2><p class="mu">Atur isian formulir tiap template.</p></div><div class="row"><input class="in" style="max-width:220px" placeholder="Cari template" aria-label="Cari template" value="${esc(S.qk)}" oninput="filterTpl(this.value)"><button class="btn pri" onclick="kModal()">Tambah template</button></div></div>`+
    `<div id="tp-list">${keys.map((k,ci)=>tplCardHTML(ci)).join('')||'<div class="card mu">Belum ada template.</div>'}</div>`+
    `<p id="tp-empty" class="mu" hidden>Tidak ada template yang cocok dengan pencarian.</p>`;
}
function filterTpl(v){
  S.qk=v;const q=v.trim().toLowerCase();let n=0,tot=0;
  document.querySelectorAll('#tp-list details[data-n]').forEach(d=>{tot++;const ok=d.dataset.n.indexOf(q)>=0;d.hidden=!ok;if(ok)n++;});
  const e=$('tp-empty');if(e)e.hidden=n>0||!tot;
}
function tglT(d){if(d.open)S.openT=d.dataset.k;else if(S.openT===d.dataset.k)S.openT='';}
function tplCardHTML(ci,open){
  const k=tk(ci),fl=TPL[k]||[],q=S.qk.trim().toLowerCase(),key=(k+' '+JLABEL(TJ[k])).toLowerCase();
  const op=open===undefined?S.openT===k:open;

const STAT=['Hadir','Izin','Sakit','Alpa'];
const pd=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const wd=s=>pd(s).getDay()||7;

function hariJadwal(gid,vp){
  const j=JD[gid]||[],out=[],ld=lastDay(vp);
  for(let d=1;d<=ld;d++){const t=vp+'-'+String(d).padStart(2,'0');if(j.indexOf(wd(t))>=0)out.push(t);}
  return out;
}

  if(!rows.length)return toast('Tidak ada data pelanggaran untuk siswa ini','er');
  const th=d.th||50;

  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();

  doc.text('SURAT PERJANJIAN SISWA',W/2,y,{align:'center'});y+=5.5;
  doc.setFont('times','normal');doc.setFontSize(10);doc.setTextColor(90,90,90);

  doc.setDrawColor(0,0,0);doc.setLineWidth(.3);doc.line(14,y,W-14,y);y+=7;
  doc.setTextColor(0,0,0);doc.setFontSize(10.5);

  const ro=S.user.r==='PIMPINAN';
  const head=`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>Rekap poin siswa</h2><p class="mu">${ro?'Rekapitulasi akumulasi poin pelanggaran dan prestasi per siswa dari laporan seluruh guru (read-only).':'Akumulasi poin pelanggaran per siswa dari seluruh laporan guru, beserta prestasi yang tercatat. Tingkat poin bersifat informasi: 25+ teguran, 50+ panggilan orang tua, 100+ skorsing.'}</p></div></div>`;
  if((KSPL===null&&!KSPLB)||(KPLS===null&&!KPLSB)){if(KSPL===null&&!KSPLB)kesLanggarLoad();if(KPLS===null&&!KPLSB)kesPrestLoad();return head+`<div class="card mu">Memuat…</div>`;}
  if(KSPLB||KPLSB)return head+`<div class="card mu">Memuat…</div>`;

  const flt=`<div class="row" style="margin:12px 0;flex-wrap:wrap"><select class="in" aria-label="Filter kelas" onchange="S.kpf=this.value;render(true)"><option value="">Semua kelas</option>${ks.map(k=>`<option value="${esc(k)}" ${kf===k?'selected':''}>Kelas ${esc(k)}</option>`).join('')}</select><input class="in" placeholder="Cari nama siswa" aria-label="Cari nama siswa" value="${esc(S.kpq||'')}" oninput="S.kpq=this.value;render(true)"></div>`;
  const stt=`<div class="stats">${[['Siswa terlibat',SW.filter(s=>hasOwn(agg,s.id)).length,''],['Total laporan pelanggaran',lg.length,'er'],['Total prestasi',pr.length,'ok'],['Poin tertinggi',list.length?list[0].p:0,'wa']].map(([l,v,k])=>`<div class="stat ${k}"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`;

  const rows=list.map(o=>`<tr><td><b>${esc(o.s.n)}</b><td>${esc(o.s.k||'-')}<td>${kesPoBadge(o.p)}<td>${o.nl}<td>${o.np}<td class="nw"><button class="btn ghost sm" onclick="kesPoinDet('${esc(o.s.id)}')">Detail</button></tr>`).join('');
  const cards=list.map(o=>`<div class="mcard">${mzone(`kesPoinDet('${esc(o.s.id)}')`,`<div class="mc-h"><div><b>${esc(o.s.n)}</b> <span class="tag">Kelas ${esc(o.s.k||'-')}</span><div class="mc-sub mt">${kesPoBadge(o.p)}</div><div class="mc-sub">${o.nl} pelanggaran · ${o.np} prestasi</div></div></div>`)}<div class="mc-f" style="justify-content:flex-end"><button class="btn ghost sm" onclick="kesPoinDet('${esc(o.s.id)}')">Detail</button></div></div>`).join('');
  return head+stt+flt+(isMob()?`<div class="mcl">${cards}</div>`:`<div class="card tw"><table><thead><tr><th>Siswa<th>Kelas<th>Total poin<th>Pelanggaran<th>Prestasi<th>Aksi</thead><tbody>${rows}</tbody></table></div>`);

const NJ_DEF=[{k:'harian',l:'Nilai Harian',n:4,s:'0-100'},{k:'psts',l:'PSTS (Tengah Semester)',n:1,s:'0-100'},{k:'pas',l:'PAS (Akhir Semester)',n:1,s:'0-100'}];
const skalaOf=j=>{const t=/^(\d+)-(\d+)$/.exec(String(j&&j.s||'').trim());return t?{mn:+t[1],mx:+t[2],lab:t[1]+'–'+t[2]}:{mn:0,mx:100,lab:'0–100'};};
const skalaJ=k=>skalaOf(nj().find(j=>j.k===String(k).replace(/-\d+$/,'')));
const skalaTxt=js=>{const u=[...new Set(js.map(j=>skalaOf(j).lab))];return u.length<=1?(u[0]||'0–100'):js.map(j=>j.l+' '+skalaOf(j).lab).join(' · ');};
const nj=()=>NJ&&NJ.length?NJ:NJ_DEF;
const kelasList=()=>[...new Set(SW.map(s=>s.k))].sort((a,b)=>a.localeCompare(b,'id',{numeric:true}));
const canNil=()=>S.user.r==='GURU'||S.user.r==='ADMIN';
const canMgrNil=()=>S.user.r==='ADMIN'||S.user.r==='KURIKULUM'||S.user.r==='TU';
const mapelBerlaku=(m,k)=>!m.kl||!m.kl.length||m.kl.indexOf(k)>=0;
const mpGuru=m=>Array.isArray(m&&m.gs)?m.gs:(m&&m.g?[m.g]:[]);
const mpMine=(m,id)=>mpGuru(m).indexOf(id)>=0;
const mpGuruN=(m,me)=>mpGuru(m).map(id=>id===me?'Anda':gname(id)).join(', ');
const mpKelasMine=(m,id)=>{if(!mpMine(m,id))return null;const mine=((m&&m.ap)||[]).filter(a=>a.g===id);const out=[];mine.forEach(a=>(a.k||[]).forEach(k=>{if(out.indexOf(k)<0)out.push(k);}));return out;};
const mpKelasOk=(m,id,k)=>{const km=mpKelasMine(m,id);return !km||!km.length||km.indexOf(k)>=0;};
const mpAmpuTxt=m=>{const gs=mpGuru(m);if(!gs.length)return'';const ap=(m&&m.ap)||[];if(!ap.length)return gs.map(id=>gname(id)).join(', ');return gs.map(id=>{const ks=[];ap.filter(a=>a.g===id).forEach(a=>(a.k||[]).forEach(k=>{if(ks.indexOf(k)<0)ks.push(k);}));return gname(id)+(ks.length?' ('+ks.join(', ')+')':' (semua kelas)');}).join(' · ');};

function nilaiTable(m,ro){
  const sw=SW.filter(s=>s.k===S.nk);
  if(!sw.length)return'<div class="note">Tidak ada siswa di kelas ini.</div>';
  const cols=[];
  nj().forEach(j=>{if(S.njv&&j.k!==S.njv)return;for(let i=1;i<=j.n;i++)cols.push({k:j.k+'-'+i,i,l:j.l,n:j.n,sc:skalaOf(j)});});
  const skT=skalaTxt(nj().filter(j=>!S.njv||j.k===S.njv));
  const inp=(s,c,mob)=>{const v=NL[s.id+'|'+c.k]??'';
    return`<input class="in nl" type="number" min="${c.sc.mn}" max="${c.sc.mx}" step="any" inputmode="decimal" ${mob?'':'style="width:68px;padding:6px;text-align:center"'} data-s="${s.id}" data-k="${c.k}" data-o="${esc(v)}" value="${esc(v)}" aria-label="${esc(s.n+' '+c.l+' '+c.i)}" ${ro?'disabled':''}>`;};
  const info=`<p class="mu mt">${sw.length} siswa · ${esc(m.n)}${mpGuru(m).length?' · pengampu: '+esc(mpGuruN(m,S.user.id)):''} · kelas ${esc(S.nk)} · skala ${skT}. ${S.njv?'':'Semua jenis penilaian tampil. '}Kosongkan jika belum ada.</p>`;
  const pdfBtn=`<button class="btn ghost" onclick="nilaiPdf()">Unduh PDF</button>`;
  if(isMob()){
    return(ro?'':`<div class="row" style="margin:12px 0"><button class="btn pri" onclick="saveNil()">Simpan nilai (massal)</button><span class="mu">Isi nilai pada kartu di bawah, lalu simpan sekali untuk semua siswa.</span></div>`)+
      `<div class="mcl">${sw.map((s,i)=>{
        const vals=cols.map(c=>NL[s.id+'|'+c.k]).filter(v=>v!==undefined&&v!==null&&v!=='');
        const avg=vals.length?Math.round(vals.reduce((a,b)=>a+ +b,0)/vals.length*100)/100:null;
        return`<div class="mcard"><div class="mc-h"><div><b>${i+1}. ${esc(s.n)}</b><div class="mc-sub">${vals.length} dari ${cols.length} nilai terisi</div></div><b>${avg===null?'-':avg}</b></div>`+
          `<div class="nl-grid">${cols.map(c=>`<label class="nl-it"><span>${esc(c.n>1?c.l+' '+c.i:c.l)}</span>${inp(s,c,true)}</label>`).join('')}</div></div>`;
      }).join('')}</div>`+
      info+`<div class="row" style="margin-top:12px">${pdfBtn}</div>`;
  }
  const jAktif=nj().filter(j=>!S.njv||j.k===S.njv);
  const h1='<th rowspan="2">No</th><th rowspan="2">Siswa</th>'+jAktif.map(j=>`<th class="ctr" colspan="${j.n}">${esc(j.l)}</th>`).join('');
  const h2=cols.map(c=>`<th class="ctr">${c.i}</th>`).join('');
  const rowsH=sw.map((s,i)=>`<tr><td>${i+1}</td><td class="nw"><b>${esc(s.n)}</b></td>`+cols.map(c=>`<td>${inp(s,c)}</td>`).join('')+'</tr>').join('');
  return`<div class="tw" style="margin-top:12px"><table><thead><tr>${h1}</tr><tr>${h2}</tr></thead><tbody>${rowsH}</tbody></table></div>`+
    info+`<div class="row" style="margin-top:12px">${ro?'':'<button class="btn pri" onclick="saveNil()">Simpan nilai</button>'}${pdfBtn}</div>`;
}

function saveNil(){
  const ch=nlChanged();
  if(!ch.length)return toast('Tidak ada perubahan untuk disimpan','er');
  const items=[];
  for(const e of ch){
    const v=e.value.trim().replace(',','.');
    const sc=skalaJ(e.dataset.k);
    if(v!==''&&(isNaN(+v)||+v<sc.mn||+v>sc.mx))return toast('Nilai harus berupa angka '+sc.mn+' sampai '+sc.mx,'er');
    items.push({s:e.dataset.s,k:e.dataset.k,v});
  }
  rpc('saveNilai',{mapelId:S.nm,kelas:S.nk,items}).then(r=>{
    toast('Nilai tersimpan ('+((r.info&&r.info.n)||0)+' perubahan)','ok');nilLoad();
  }).catch(e=>toast(e.message,'er'));
}
function nilaiPdf(){
  if(needP(nilaiPdf,arguments))return;
  const m=MP.find(x=>x.id===S.nm);
  if(!m||!S.nk)return toast('Pilih kelas dan mata pelajaran terlebih dahulu','er');
  const sw=SW.filter(s=>s.k===S.nk);
  if(!sw.length)return toast('Tidak ada siswa di kelas ini.','er');
  const cols=[];
  nj().forEach(j=>{if(S.njv&&j.k!==S.njv)return;for(let i=1;i<=j.n;i++)cols.push({k:j.k+'-'+i,h:j.n>1?j.l+' '+i:j.l});});
  const live={};
  document.querySelectorAll('input.nl').forEach(e=>live[e.dataset.s+'|'+e.dataset.k]=e.value.trim());
  const body=sw.map((s,i)=>{
    const r=[i+1,s.n];let sum=0,n=0;
    cols.forEach(c=>{
      const key=s.id+'|'+c.k,v=hasOwn(live,key)?live[key]:(NL[key]??'');
      if(v!==''){sum+=+v;n++;}
      r.push(v===''?'-':v);
    });
    r.push(n?Math.round(sum/n*100)/100:'-');
    return r;
  });
  const land=cols.length>8,W=land?277:190;
  const per=Math.min(22,Math.max(11,(W-9-40-16)/cols.length));
  const safe=s=>String(s).replace(/[\\\/:*?"<>|]+/g,'-').trim();
  savePdf({land:land,title:'Daftar Nilai Siswa',
    sub:'Kelas '+S.nk+' · '+m.n+(mpGuru(m).length?' · Pengampu: '+mpGuruN(m):'')+' · Semester '+(NS||'-')+' · Skala '+skalaTxt(nj().filter(j=>!S.njv||j.k===S.njv))+' · Dicetak '+today(),
    head:['No','Siswa'].concat(cols.map(c=>c.h)).concat(['Rata-rata']),body:body,
    widths:[9,40].concat(cols.map(()=>per)).concat([16]),
    note:'Jenis penilaian yang tampil: '+nj().filter(j=>!S.njv||j.k===S.njv).map(j=>j.l+' ×'+j.n).join(', ')+'. Skala nilai '+skalaTxt(nj().filter(j=>!S.njv||j.k===S.njv))+'. Tanda - berarti belum ada nilai.',
    name:'nilai-'+safe(S.nk)+'-'+safe(m.n)+'.pdf'});
  toast('PDF nilai diunduh','ok');
}

function jdAllData(kls){

let MPX=[];

  if(needX())return;
  const ws=XLSX.utils.aoa_to_sheet([
    ['Nama Mapel','Kelas','Guru Pengampu'],
    ['Matematika','Semua',''],
    ['Bahasa Indonesia','7A, 7B','Ahmad Fauzi, S.Pd.'],
    ['Fiqih Kelas 8','8A',''],
    ['Tahfidz Juz 30','7A','']
  ]);
  ws['!cols']=[{wch:30},{wch:22},{wch:34}];
  const pt=XLSX.utils.aoa_to_sheet([
    ['PETUNJUK PENGISIAN'],
    ['1. Mapel umum (ada di semua kelas): isi kolom Kelas dengan "Semua" atau kosongkan.'],
    ['2. Mapel khusus kelas: isi kelas yang memakainya, pisahkan koma, mis. 7A, 7B.'],

    ['5. Nama mapel yang sudah ada akan diperbarui (kelas, penugasan & guru pengampunya).'],
    ['6. Nama kelas sebaiknya sama dengan kelas di data siswa (mis. 7A).'],
    ['7. Skala penilaian tidak diatur di sini: skala melekat pada jenis penilaian (menu Kelola penilaian, tab Jenis penilaian).']
  ]);
  pt['!cols']=[{wch:110}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Mapel');XLSX.utils.book_append_sheet(wb,pt,'Petunjuk');
  XLSX.writeFile(wb,'template-impor-mapel.xlsx');
}
function upMapelX(inp){
  readX(inp,wb=>{
    const r=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const items=[];
    r.forEach((x,i)=>{
      const nama=String(x[0]||'').trim();
      if(!nama||(i===0&&/nama/i.test(nama)&&/kelas/i.test(String(x[1]))))return;
      items.push({nama,kelas:String(x[1]||'').replace(/[;\n]+/g,',').trim(),guru:String(x[2]||'').trim()});
    });
    MPX=items.slice(0,300);
    const el=$('mpx-info');if(!el)return;
    el.hidden=false;
    const kls=x=>x.kelas&&!/^(semua|all|\*)$/i.test(x.kelas)?esc(x.kelas):'Semua kelas';
    el.innerHTML=MPX.length
      ?`<p class="mu">${MPX.length} baris terbaca. Klik Impor untuk menyimpan.</p>`+(isMob()
        ?MPX.map(x=>`<div class="mcard" style="margin-bottom:8px"><b>${esc(x.nama)}</b><div class="mc-sub">${kls(x)}${x.guru?' · '+esc(x.guru):''}</div></div>`).join('')
        :`<div class="tw"><table><thead><tr><th>Mapel<th>Kelas<th>Guru pengampu</thead><tbody>${MPX.map(x=>`<tr><td><b>${esc(x.nama)}</b><td>${kls(x)}<td>${x.guru?esc(x.guru):'-'}`).join('')}</tbody></table></div>`)
      :'<div class="note">Tidak ada baris valid. Pastikan kolom A berisi Nama Mapel.</div>';
  });
}
function impMapel(){
  MPX=[];
  modal('Impor mata pelajaran',
    '<p class="mu">Kolom Excel: <b>Nama Mapel | Kelas | Guru Pengampu</b>.</p>'+
    '<ul class="mu"><li><b>Mapel umum</b> (semua kelas): isi Kelas dengan <b>Semua</b> atau kosongkan.</li><li><b>Mapel khusus kelas</b>: isi kelasnya, pisah koma (7A, 7B).</li><li><b>Guru pengampu</b>: nama persis seperti di Master user (boleh kosong). Nama yang tidak dikenal menolak seluruh impor.</li><li>Bila guru diisi, <b>penugasan guru tsb (mapel + kelas pada baris itu) otomatis dibuat</b> — kelas mapel mengikuti penugasannya (v5.7).</li><li>Nama mapel yang sudah ada akan diperbarui (kelas, penugasan & pengampu bila diisi).</li></ul>'+
    '<div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="tplMapelX()">Unduh template Excel</button><button class="btn ghost sm" onclick="$(\'xm\').click()">Unggah Excel</button><input id="xm" type="file" accept=".xlsx,.xls" hidden onchange="upMapelX(this)"></div>'+
    '<div id="mpx-info" class="mt" hidden></div>',
  [CANCEL,{t:'Impor',c:'pri',f:()=>{
    if(!MPX.length)return toast('Unggah file Excel dulu','er');
    const it=MPX;MPX=[];closeM();
    rpc('importMapel',{items:it}).then(r=>{const i=(r&&r.info)||{};toast(`${i.baru||0} mapel baru, ${i.upd||0} diperbarui`,'ok');render(true);}).catch(e=>toast(e.message,'er'));
  }}]);
}

let KED='',KD=null,KPV='p';
function kopHtml(K,c){
  K=Object.assign({},KOP_DEF,K||{});
  const ta=K.align==='right'?'right':K.align==='left'?'left':'center',lh=c?36:64,fs=c?[.8,.74,.62]:[1.15,1.05,.8];
  const im=src=>src?`<img src="${esc(src)}" alt="" style="height:${lh}px;width:auto;max-width:${c?60:100}px;object-fit:contain;flex:none">`:'';
  return`<div style="display:flex;align-items:center;gap:${c?8:12}px;font-family:'Times New Roman',Times,serif;color:#000">${im(K.logoL)}`+
    `<div style="flex:1;min-width:0;text-align:${ta};line-height:1.35"><div style="font-weight:700;font-size:${fs[0]}rem">${esc(K.yayasan)}</div><div style="font-weight:700;font-size:${fs[1]}rem">${esc(K.madrasah)}</div><div style="font-size:${fs[2]}rem;white-space:pre-line">${esc(K.alamat)}</div></div>${im(K.logoR)}</div>`+
    `<div style="border-top:2px solid #000;border-bottom:1px solid #000;height:4px;margin-top:${c?6:10}px"></div>`;
}
function aKop(){return KED?kopEditor():kopListView();}

  const head=`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>Pengaturan kop</h2><p class="mu">Buat lebih dari satu kop. Setiap kali Anda mengunduh PDF (laporan, rekap, nilai, jadwal, dll.) akan muncul pilihan kop yang dipakai. Kop menyesuaikan otomatis dengan orientasi potret atau lanskap.</p></div><button class="btn pri" onclick="kopNew()">+ Tambah kop</button></div>`;
  if(!KOPS.length)return head+`<div class="note">Belum ada kop tersimpan, jadi PDF memakai kop bawaan. Klik <b>+ Tambah kop</b> untuk membuat kop pertama.</div>`;
  return head+`<div class="mcl">`+KOPS.map(k=>`<div class="mcard"><div class="mc-h"><div><b>${esc(k.nm||k.id)}</b> ${k.def?'<span class="tag">Utama</span>':''}<div class="mc-sub">${k.logoL?'Logo kiri':''}${k.logoL&&k.logoR?' · ':''}${k.logoR?'Logo kanan':''}${!k.logoL&&!k.logoR?'Tanpa logo':''}</div></div></div>`+
    `<div style="background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:10px">${kopHtml(k,true)}</div>`+
    `<div class="mc-f"><span>${k.def?'':`<button class="btn ghost sm" onclick="kopUtamaSet('${esc(k.id)}')">Jadikan utama</button>`}</span><span class="acts">${ib('',`kopEdit('${esc(k.id)}')`,'edit','Ubah kop')}${KOPS.length>1?ib('del',`kopDelAsk('${esc(k.id)}')`,'trash','Hapus kop'):''}</span></div></div>`).join('')+`</div>`;
}
function kopNew(){KED='new';KD=Object.assign({},KOP_DEF,{id:'',nm:'',def:!KOPS.length});KPV='p';render(true);}
function kopEdit(id){const k=KOPS.find(x=>x.id===id);if(!k)return;KED=id;KD=Object.assign({},KOP_DEF,k);KPV='p';render(true);}
function kopCancel(){KED='';KD=null;render(true);}
function kopEditor(){
  const al=[['left','Rata kiri'],['center','Tengah'],['right','Rata kanan']];
  setTimeout(kopPrev,0);
  const logoBox=(side,lbl)=>`<div class="mcard" style="margin-top:10px"><b>${lbl}</b><p class="mu" style="margin:2px 0 0">Opsional. Gambar otomatis diperkecil (maks. 300 px). Format PNG/JPG.</p><div class="row" style="margin-top:8px;align-items:center"><span id="k-th${side}"></span><button class="btn ghost sm" onclick="$('k-f${side}').click()">Unggah logo</button><button class="btn ghost sm" id="k-del${side}" onclick="kopLogoDel('${side}')">Hapus logo</button><input id="k-f${side}" type="file" accept="image/png,image/jpeg" hidden onchange="kopLogo(this,'${side}')"></div></div>`;
  return`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>${KED==='new'?'Tambah kop':'Ubah kop'}</h2><p class="mu">Teks kop, logo kiri &amp; kanan, lalu simpan.</p></div><div class="row"><button class="btn ghost" onclick="kopCancel()">Batal</button><button class="btn pri" onclick="saveKop()">Simpan kop</button></div></div>`+
  `<div class="card"><h3>Identitas kop</h3><label for="k-n">Nama kop (untuk pilihan saat unduh)</label><input id="k-n" class="in" value="${esc(KD.nm)}" placeholder="Contoh: Kop MI, Kop Muallimin" oninput="kopSet('nm',this.value)">`+
  `<label class="jd-ck" style="margin-top:10px"><input type="checkbox" ${KD.def?'checked':''} onchange="kopSet('def',this.checked)"> Jadikan kop utama (terpilih otomatis saat unduh)</label></div>`+
  `<div class="card"><h3>Teks kop</h3>`+
  `<label for="k-y">Baris 1: Nama yayasan</label><input id="k-y" class="in" value="${esc(KD.yayasan)}" oninput="kopSet('yayasan',this.value)">`+
  `<label for="k-m">Baris 2: Nama madrasah</label><input id="k-m" class="in" value="${esc(KD.madrasah)}" oninput="kopSet('madrasah',this.value)">`+
  `<label for="k-a">Baris 3: Alamat</label><textarea id="k-a" class="in" rows="2" oninput="kopSet('alamat',this.value)">${esc(KD.alamat)}</textarea>`+
  `<label for="k-p">Posisi teks</label><select id="k-p" class="in" onchange="kopSet('align',this.value)">${al.map(a=>`<option value="${a[0]}" ${KD.align===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div>`+
  `<div class="card"><h3>Logo</h3>${logoBox('L','Logo kiri')}${logoBox('R','Logo kanan')}</div>`+
  `<div class="card"><div class="bt" style="flex-wrap:wrap"><h3>Pratinjau</h3><div class="row"><button id="k-pv-p" class="btn sm" onclick="kopPv('p')">Potret</button><button id="k-pv-l" class="btn sm" onclick="kopPv('l')">Lanskap</button></div></div><div id="kp" style="background:#fff;color:#000;border:1px solid var(--bd);border-radius:8px;padding:16px;margin-top:10px"></div></div>`;
}
function kopSet(k,v){KD[k]=v;if(k!=='def')kopPrev();}
function kopPv(v){KPV=v;kopPrev();}
function kopPrev(){
  const el=$('kp');if(!el||!KD)return;
  el.style.maxWidth=KPV==='p'?'540px':'100%';
  el.innerHTML=kopHtml(KD,false);
  ['p','l'].forEach(x=>{const b=$('k-pv-'+x);if(b)b.className='btn sm '+(KPV===x?'pri':'ghost');});
  ['L','R'].forEach(sd=>{
    const th=$('k-th'+sd),d=$('k-del'+sd);
    if(th)th.innerHTML=KD['logo'+sd]?`<img src="${esc(KD['logo'+sd])}" alt="" style="height:44px;width:auto;max-width:90px;object-fit:contain;border:1px solid var(--bd);border-radius:6px;background:#fff">`:'<span class="mu">Belum ada logo</span>';
    if(d)d.hidden=!KD['logo'+sd];
  });
}
function kopLogo(inp,sd){
  const f=inp.files[0];inp.value='';if(!f)return;
  if(!/^image\/(png|jpeg)$/.test(f.type))return toast('Logo harus berformat PNG atau JPG','er');
  if(f.size>3e6)return toast('Ukuran file maksimal 3 MB','er');
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const m=300,sc=Math.min(1,m/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      const data=c.toDataURL('image/jpeg',.85);
      if(data.length>140000)return toast('Logo terlalu besar setelah diproses, gunakan gambar yang lebih sederhana','er');
      KD['logo'+sd]=data;KD['r'+sd]=h/w;
      kopPrev();
    };
    im.onerror=()=>toast('Gambar tidak dapat dibaca','er');
    im.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function kopLogoDel(sd){KD['logo'+sd]='';KD['r'+sd]=1;kopPrev();}
function saveKop(){
  if(!String(KD.nm||'').trim())return toast('Nama kop wajib diisi','er');
  if(!String(KD.yayasan||'').trim()&&!String(KD.madrasah||'').trim())return toast('Isi minimal nama yayasan atau madrasah','er');
  rpc('saveKop',{kop:KD}).then(()=>{toast('Kop tersimpan','ok');KED='';KD=null;render(true);}).catch(e=>toast(e.message,'er'));
}
function kopUtamaSet(id){run('setKopUtama',{id},'Kop utama diubah');}
function kopDelAsk(id){
  const k=KOPS.find(x=>x.id===id);if(!k)return;
  confirmM('Hapus kop',`Kop "${k.nm||k.id}" akan dihapus permanen.${k.def?' Kop pertama yang tersisa akan menjadi kop utama.':''} Lanjutkan?`,()=>run('delKop',{id},'Kop dihapus'));
}

let DAI=null,DAI_P='',DAI_BUSY=false,DAI_ERR='',DAI_TS='';
function aDashai(){
  if(DAI_P!==S.vp){DAI=null;DAI_ERR='';DAI_TS='';DAI_P=S.vp;}
  const btn=DAI_BUSY?'<button class="btn pri" disabled>Menganalisis…</button>':`<button class="btn pri" onclick="dashaiRun(${DAI?'true':''})">${DAI?'Analisis ulang':'Analisis dengan AI'}</button>`;
  const head=`<div class="bt" style="flex-wrap:wrap;margin:12px 0"><div><h2>Analisis kinerja</h2><p class="mu">Kesimpulan bulanan dari laporan kinerja, absensi, nilai siswa, izin guru, kesiswaan (pelanggaran & BK, prestasi, kegiatan), dan sarana prasarana sebagai bahan rapat.</p></div><div class="row">${perSel()}${btn}</div></div>`;
  if(DAI_BUSY)return head+dashaiSkeleton();
  if(DAI_ERR)return head+`<div class="note" style="background:var(--erb);color:var(--er)"><b>Analisis gagal.</b> ${esc(DAI_ERR)}</div>`;
  if(!DAI)return head;
  const sec=(t,b)=>`<div class="card"><h3>${esc(t)}</h3>${b}</div>`;
  const S2=DAI.stat||{},Pv=DAI.prev,NL=DAI.nl||null;
  const dl=(a,b,suf)=>{if(a==null||b==null)return'';const d=Math.round((a-b)*10)/10;return d===0?'sama dengan bulan lalu':(d>0?'▲ ':'▼ ')+Math.abs(d)+suf+' dari bulan lalu';};
  const card=(v,l,k,d)=>`<div class="stat ${k}"><b>${v}</b><span>${l}</span>${d?`<span class="chip">${esc(d)}</span>`:''}</div>`;
  const nl=a=>a&&a.length?`<ul>${a.map(x=>`<li><b>${esc(x.nama)}</b>: ${esc(x.alasan)}</li>`).join('')}</ul>`:'';
  let h=head;
  if(DAI.kesimpulan)h+=`<div class="card sum"><h3>Kesimpulan bulan ini</h3><p>${esc(DAI.kesimpulan)}</p></div>`;
  h+=`<div class="stats">`+
    card(S2.avg==null?'-':S2.avg+'%','Rata-rata capaian',S2.avg!=null&&S2.avg<75?'wa':'ok',Pv?dl(S2.avg,Pv.avg,' poin'):'')+
    card(S2.pct==null?'-':S2.pct+'%','Kehadiran guru',S2.pct!=null&&S2.pct<90?'wa':'ok',Pv?dl(S2.pct,Pv.pct,' poin'):'')+
    card((S2.lengkap||0)+'/'+(S2.guru||0),'Guru lapor lengkap',(S2.belum||0)?'wa':'ok',Pv?'bulan lalu: '+Pv.lengkap+'/'+Pv.guru:'')+
    card(S2.alpa||0,'Total Alpa',(S2.alpa||0)?'er':'ok',Pv?'bulan lalu: '+Pv.alpa:'')+`</div>`;
  if(NL&&NL.mapel&&NL.mapel.length){
    const tp=NL.total?Math.round(NL.tuntas/NL.total*100):0;
    const lo=NL.mapel[0],hiM=NL.mapel[NL.mapel.length-1];
    h+=`<div class="stats">`+
      card(NL.avg,'Rata nilai siswa',NL.avg<75?'wa':'ok','semester '+esc(NL.sem||''))+
      card(tp+'%','Ketuntasan nilai (≥75)',tp<75?'wa':'ok',NL.tuntas+' dari '+NL.total+' rata siswa/mapel')+
      card(lo.avg,'Mapel terendah: '+esc(trunc(lo.n,22)),lo.avg<75?'er':'wa',lo.g?'pengampu: '+trunc(lo.g,26):'tanpa pengampu')+
      card(hiM.avg,'Mapel tertinggi: '+esc(trunc(hiM.n,22)),'ok',hiM.g?'pengampu: '+trunc(hiM.g,26):'tanpa pengampu')+`</div>`;
  }
    h+=`<div class="stats">`+
    card(S2.plg||0,'Pelanggaran siswa',(S2.plg||0)?'wa':'ok',(S2.plgPoin||0)+' poin bulan ini')+
    card(S2.sesi||0,'Sesi konseling','ok','tercatat bulan ini (Admin BK)')+
    card(S2.spj||0,'Surat perjanjian',(S2.spj||0)?'wa':'ok','dibuat bulan ini (poin ≥ 50)')+
    card(S2.prestasi||0,'Prestasi siswa','ok',(S2.kegiatan||0)+' kegiatan bulan ini')+`</div>`;
  h+=`<div class="stats">`+
    card(S2.izn||0,'Izin guru',(S2.iznTunda||0)?'wa':'ok',(S2.iznOk||0)+' disetujui bulan ini')+
    card(S2.aduan||0,'Pengaduan sarana',(S2.aduan||0)?'wa':'ok',(S2.aduanBuka||0)+' belum selesai')+
    card(S2.pinjam||0,'Peminjaman sarana','ok','pengajuan bulan ini')+
    card(S2.bolos||0,'Bolos (absensi kelas)',(S2.bolos||0)?'er':'ok',(S2.hadirS||0)+' hadir tercatat')+`</div>`;
  if(DAI.perbandingan)h+=sec('Perbandingan dengan bulan lalu','<p>'+esc(DAI.perbandingan)+'</p>');

function dashaiDraft(){
  const L=(P.find(x=>x.k===DAI_P)||{}).l||DAI_P,S2=DAI.stat||{},out=[];
  const sec=(t,x)=>{if(x&&x.length){out.push(t);out.push(x);out.push('');}};
  out.push('DRAFT AGENDA RAPAT BULANAN');out.push('Periode: '+L);out.push('');
  sec('1. KESIMPULAN BULAN INI',DAI.kesimpulan);
  sec('2. PERBANDINGAN DENGAN BULAN LALU',DAI.perbandingan);
  out.push('3. KEPATUHAN PELAPORAN');out.push((S2.lengkap||0)+' guru lengkap, '+(S2.sebagian||0)+' sebagian, '+(S2.belum||0)+' belum mengisi'+((S2.belumNama||[]).length?' ('+S2.belumNama.join(', ')+')':'')+'.');out.push('');
  if(DAI.analisis_nilai){out.push('4. ANALISIS NILAI SISWA'+(DAI.nl&&DAI.nl.sem?' (SEMESTER '+DAI.nl.sem+')':''));out.push('   '+DAI.analisis_nilai);out.push('');}
  if(DAI.mapel_perhatian.length){out.push('5. MAPEL PERLU PERHATIAN');DAI.mapel_perhatian.forEach((x,i)=>out.push('   '+(i+1)+'. '+x.mapel+': '+x.alasan));out.push('');}
  if(DAI.tema_kendala.length){out.push('6. TEMA KENDALA');DAI.tema_kendala.forEach((t,i)=>out.push('   '+(i+1)+'. '+t.tema+' ('+t.guru+' guru, solusi: '+t.solusi+') - '+t.uraian+(t.dukungan?' Dukungan: '+t.dukungan:'')));out.push('');}
  if(DAI.pendampingan.length){out.push('7. PERLU PENDAMPINGAN');DAI.pendampingan.forEach(x=>out.push('   - '+x.nama+': '+x.alasan));out.push('');}
  if(DAI.apresiasi.length){out.push('8. APRESIASI');DAI.apresiasi.forEach(x=>out.push('   - '+x.nama+': '+x.alasan));out.push('');}
  sec('9. POLA KEHADIRAN',DAI.pola_kehadiran);
  sec('10. ASPIRASI GURU',DAI.aspirasi);
  if(DAI.kondisi_siswa){out.push('11. KONDISI KESISWAAN & BIMBINGAN KONSELING');out.push('   '+DAI.kondisi_siswa);DAI.siswa_perhatian.forEach(x=>out.push('   - Perhatian: '+x.nama+' — '+x.alasan));out.push('');}
  if(DAI.kondisi_sarpras){out.push('12. KONDISI SARANA PRASARANA');out.push('   '+DAI.kondisi_sarpras);DAI.sarpras_perhatian.forEach(x=>out.push('   - Prioritas: '+x.nama+' — '+x.alasan));out.push('');}
  sec('13. IZIN GURU',DAI.kondisi_izin);
  if(DAI.agenda_rapat.length){out.push('14. USULAN AGENDA RAPAT');DAI.agenda_rapat.forEach((k,i)=>out.push('   '+(i+1)+'. '+k));out.push('');}
  out.push('Disusun otomatis oleh AI ('+CFG.nama+', '+DAI_TS+'). Mohon ditinjau sebelum rapat.');
  return out.join('\n');
}
function dashaiCopy(){
  if(!DAI)return;
  const t=dashaiDraft(),ok=()=>toast('Draft rapat disalin ke clipboard','ok');
    const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();
    let done=false;try{done=document.execCommand('copy');}catch(e){}
    ta.remove();
    if(done)ok();
    else modal('Draft rapat','<p class="mu">Salin otomatis diblokir peramban. Salin manual teks di bawah (klik untuk blok semua):</p><textarea class="in" rows="10" readonly onclick="this.select()">'+esc(t)+'</textarea>',[{t:'Tutup',c:'ghost',f:()=>closeM()}]);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok).catch(fb);
  else fb();
}

const wKodeCmp=(a,b)=>{
  const pa=/^(.*)-(\d+)$/.exec(String(a||''))||['','',''],pb=/^(.*)-(\d+)$/.exec(String(b||''))||['','',''];
  const ia=(NJ||[]).findIndex(j=>j.k===pa[1]),ib=(NJ||[]).findIndex(j=>j.k===pb[1]);
